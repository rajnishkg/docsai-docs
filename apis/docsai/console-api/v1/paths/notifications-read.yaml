post:
  operationId: markNotificationsRead
  tags: [Notifications]
  summary: Mark notifications read
  description: Marks the given notification ids, or all of them, as read. Unknown ids are ignored.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          oneOf:
            - type: object
              required: [ids]
              additionalProperties: false
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: {type: integer, minimum: 1}
            - type: object
              required: [all]
              additionalProperties: false
              properties:
                all: {type: boolean, const: true}
        example: {all: true}
  responses:
    '200':
      description: Remaining unread count.
      content:
        application/json:
          schema:
            type: object
            properties:
              unread: {type: integer}
          example: {unread: 0}
    '400':
      description: Neither ids nor all was sent.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: VALIDATION_FAILED, message: 'Send ids (positive integers, at most 200) or all: true.'}
