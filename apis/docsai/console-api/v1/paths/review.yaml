parameters:
  - name: project
    in: path
    required: true
    description: Project id.
    schema: {type: string, format: uuid}
post:
  operationId: reviewCommit
  tags: [Repository]
  summary: Submit, approve or request changes
  description: |
    Records a review action on the exact branch head. `submit` needs the draft permission;
    `approve` and `request-changes` need the review permission. An approval belongs to one commit:
    any later commit needs a new review.
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas.yaml#/ReviewRequest}
        example: {branch: work/author/components-page, expectedHead: 4c6e8f0a1b3c5d7e9f1a2b3c4d9a1f0c3d5e7b2a, action: approve, comment: Reads well.}
  responses:
    '200':
      description: Review recorded.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Review}
          example: {status: approved, decision: approve, commit: 4c6e8f0a1b3c5d7e9f1a2b3c4d9a1f0c3d5e7b2a, branch: work/author/components-page}
    '409':
      description: The branch moved after you loaded it.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: CONFLICT, message: Review commit changed. Reload the branch.}
