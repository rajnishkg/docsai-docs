get:
  operationId: getSession
  tags: [Session]
  summary: Get the current session
  description: Returns the signed-in person, their tenant and the permissions they hold, evaluated on a project when you pass one. It answers without a session too, with `principal` null.
  security: []
  parameters:
    - name: project
      in: query
      required: false
      description: Project id to evaluate capabilities on.
      schema: {type: string, format: uuid}
  responses:
    '200':
      description: The session. `principal` is null when nobody is signed in.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Session}
          example:
            principal: {id: synthetic-author, tenant: acme, name: author}
            platformAdmin: false
            tenant: {id: acme, name: Acme Corporation, readerOrigin: 'http://acme.docs.localhost:4174'}
            capabilities: [draft, workspace, read-insights]
            needsTeam: false
            demo: true
post:
  operationId: startDemoSession
  tags: [Session]
  summary: Sign in with a synthetic identity (local demo only)
  description: Starts a session for one of the fixed synthetic identities of the local demo console and sets the `docsai_demo` cookie. A production console answers `403 IAM_NOT_CONNECTED`.
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [identity]
          properties:
            identity:
              type: string
              enum: [author, reviewer, admin, reader, api-author]
        example: {identity: author}
  responses:
    '200':
      description: Signed in. The response sets the session cookie.
      content:
        application/json:
          schema:
            type: object
            properties:
              principal: {$ref: ../components/schemas.yaml#/Principal}
              demo: {type: boolean}
          example:
            principal: {id: synthetic-author, tenant: acme, name: author}
            demo: true
    '400':
      description: Unknown identity.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: INVALID_IDENTITY}
    '403':
      description: Not a demo console, or the identity's tenant is not active.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: IAM_NOT_CONNECTED}
