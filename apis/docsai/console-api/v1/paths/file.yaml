parameters:
  - name: project
    in: path
    required: true
    description: Project id.
    schema: {type: string, format: uuid}
get:
  operationId: getFile
  tags: [Repository]
  summary: Read a file
  description: Returns the text of one tracked file on a branch, with the blob id you need to save it.
  parameters:
    - name: branch
      in: query
      required: true
      description: Branch name.
      schema: {type: string}
    - name: path
      in: query
      required: true
      description: Repository path of the file.
      schema: {type: string}
  responses:
    '200':
      description: File text.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/FileContent}
          example:
            branch: main
            head: 9a1f0c3d5e7b2a4c6e8f0a1b3c5d7e9f1a2b3c4d
            path: docs/docsai/v1/writing/create-a-page.md
            blob: 361c9fa2c074548bb766cb14f6bf5b9a57a3488a
            body: "# Create a page\n\nStart a branch, then choose New page.\n"
            editable: true
            byteLimit: 1048576
    '404':
      description: The file is not tracked on this branch.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: NOT_FOUND, message: Tracked file unavailable.}
put:
  operationId: saveFile
  tags: [Repository]
  summary: Commit a file
  description: Writes the full text of one file as a commit on your branch. The text is validated like a release before the commit lands.
  requestBody:
    required: true
    content:
      application/json:
        schema: {$ref: ../components/schemas.yaml#/SaveFile}
        example:
          branch: work/author/components-page
          path: docs/docsai/v1/writing/create-a-page.md
          body: "# Create a page\n\nUpdated text.\n"
          message: 'docs(writing): clarify the New page form'
          expectedHead: 9a1f0c3d5e7b2a4c6e8f0a1b3c5d7e9f1a2b3c4d
          expectedBlob: 361c9fa2c074548bb766cb14f6bf5b9a57a3488a
  responses:
    '200':
      description: Committed. `head` is the new commit.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/FileContent}
          example:
            branch: work/author/components-page
            head: 4c6e8f0a1b3c5d7e9f1a2b3c4d9a1f0c3d5e7b2a
            path: docs/docsai/v1/writing/create-a-page.md
            blob: 7b2a4c6e8f0a1b3c5d7e9f1a2b3c4d9a1f0c3d5e
            body: "# Create a page\n\nUpdated text.\n"
            editable: true
            byteLimit: 1048576
    '400':
      description: The text failed validation.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: VALIDATION_FAILED, message: Describe this commit in a single line.}
    '409':
      description: Someone changed the file after you loaded it.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: CONFLICT, message: 'Someone changed docs/docsai/v1/writing/create-a-page.md since you loaded it. Reload; your text is still in the editor.', paths: [docs/docsai/v1/writing/create-a-page.md]}
