parameters:
  - name: project
    in: path
    required: true
    description: Project id.
    schema: {type: string, format: uuid}
get:
  operationId: getDiff
  tags: [Repository]
  summary: Show what a branch changes
  description: Returns the Git diff between the published base and the branch head. Reviewers read this diff before they approve.
  parameters:
    - name: branch
      in: query
      required: true
      description: Branch name.
      schema: {type: string}
  responses:
    '200':
      description: Unified diff.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Diff}
          example:
            branch: work/author/components-page
            head: 4c6e8f0a1b3c5d7e9f1a2b3c4d9a1f0c3d5e7b2a
            base: 9a1f0c3d5e7b2a4c6e8f0a1b3c5d7e9f1a2b3c4d
            sourceBase: 9a1f0c3d5e7b2a4c6e8f0a1b3c5d7e9f1a2b3c4d
            behind: false
            diff: "diff --git a/docs/docsai/v1/writing/create-a-page.md b/docs/docsai/v1/writing/create-a-page.md\n"
    '404':
      description: Unknown project or branch.
      content:
        application/json:
          schema: {$ref: ../components/schemas.yaml#/Error}
          example: {code: NOT_FOUND}
