parameters:
  - name: invoiceId
    in: path
    required: true
    description: Invoice id.
    schema: {type: string}
get:
  operationId: getInvoice
  tags: [Invoices]
  summary: Get an invoice
  description: Returns one invoice.
  responses:
    '200':
      description: The invoice.
      content:
        application/json:
          schema: {$ref: ../openapi.yaml#/components/schemas/Invoice}
          example: {id: inv_0001, customer: cus_example, status: paid, currency: EUR, total: 12900, issuedAt: '2026-10-01'}
    '404':
      description: No invoice with this id.
      content:
        application/json:
          schema: {$ref: ../openapi.yaml#/components/schemas/Error}
          example: {code: NOT_FOUND, message: No invoice inv_9999.}
