get:
  operationId: listInvoices
  tags: [Invoices]
  summary: List invoices
  description: Lists invoices, newest first, optionally only one status.
  parameters:
    - name: status
      in: query
      required: false
      description: Only invoices with this status.
      schema:
        type: string
        enum: [draft, open, paid, void]
  responses:
    '200':
      description: Invoices.
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: {$ref: ../openapi.yaml#/components/schemas/Invoice}
          example:
            items:
              - {id: inv_0002, customer: cus_example, status: open, currency: EUR, total: 4900, issuedAt: '2026-11-01'}
              - {id: inv_0001, customer: cus_example, status: paid, currency: EUR, total: 12900, issuedAt: '2026-10-01'}
    '401':
      description: Missing or expired token.
      content:
        application/json:
          schema: {$ref: ../openapi.yaml#/components/schemas/Error}
          example: {code: UNAUTHENTICATED, message: Send a bearer token.}
