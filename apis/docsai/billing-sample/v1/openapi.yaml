# Billing sample API (private), one file.
openapi: 3.1.0
info:
  title: Billing sample API
  version: v1
  summary: A sample private API. It shows how DocsAI keeps an internal API inside the console.
  description: |
    A small, made-up billing API used to demonstrate private APIs in DocsAI. Its catalog entry is
    `classification: protected`, so it is never part of a reader release. Signed-in console users read
    it in Schema Studio (Reference) and try it there (Test).

    All data in the examples is synthetic.
  contact:
    name: DocsAI documentation team
    url: https://github.com/rajnishkg/docsai-docs
servers:
  - url: http://127.0.0.1:4021
    description: Local mock
  - url: https://billing.example.invalid/v1
    description: Example host (does not resolve)
tags:
  - name: Invoices
    description: Invoices issued to a customer account.
security:
  - bearerToken: []
paths:
  /invoices:
    get:
      operationId: listInvoices
      tags:
        - Invoices
      summary: List invoices
      description: Lists invoices, newest first, optionally only one status.
      parameters:
        - name: status
          in: query
          required: false
          description: Only invoices with this status.
          schema:
            type: string
            enum:
              - draft
              - open
              - paid
              - void
      responses:
        "200":
          description: Invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
              example:
                items:
                  - id: inv_0002
                    customer: cus_example
                    status: open
                    currency: EUR
                    total: 4900
                    issuedAt: 2026-11-01
                  - id: inv_0001
                    customer: cus_example
                    status: paid
                    currency: EUR
                    total: 12900
                    issuedAt: 2026-10-01
        "401":
          description: Missing or expired token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: UNAUTHENTICATED
                message: Send a bearer token.
  /invoices/{invoiceId}:
    parameters:
      - name: invoiceId
        in: path
        required: true
        description: Invoice id.
        schema:
          type: string
    get:
      operationId: getInvoice
      tags:
        - Invoices
      summary: Get an invoice
      description: Returns one invoice.
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
              example:
                id: inv_0001
                customer: cus_example
                status: paid
                currency: EUR
                total: 12900
                issuedAt: 2026-10-01
        "404":
          description: No invoice with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: NOT_FOUND
                message: No invoice inv_9999.
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: An access token from your identity provider. Never paste a real token into a page.
  schemas:
    Invoice:
      type: object
      required:
        - id
        - customer
        - status
        - total
      properties:
        id:
          type: string
          examples:
            - inv_0001
        customer:
          type: string
          examples:
            - cus_example
        status:
          type: string
          enum:
            - draft
            - open
            - paid
            - void
        currency:
          type: string
          examples:
            - EUR
        total:
          type: integer
          description: Amount in the smallest currency unit.
          examples:
            - 12900
        issuedAt:
          type: string
          format: date
    Error:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          examples:
            - NOT_FOUND
        message:
          type: string
